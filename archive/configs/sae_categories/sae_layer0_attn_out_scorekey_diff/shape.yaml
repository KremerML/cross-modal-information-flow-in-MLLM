model:
  name: liuhaotian/llava-v1.5-7b
  target_layer: 0
  d_model: 4096
  conv_mode: vicuna_v1
  model_base: null
  activation_site: attn_out
sae:
  n_features: 32768
  l1_coeff: 0.001
training:
  batch_size: 32
  learning_rate: 0.0001
  epochs: 10
  seed: 42
  dtype: float32
reproducibility:
  seed: 42
  deterministic: true
  benchmark: false
experiment:
  output_dir: output/sae_experiments/first_pass_layer0_attn_out_diff_shape
  output_base: output/sae_experiments
  name: first_pass_layer0_attn_out_diff_shape
  use_timestamp: false
dataset:
  task_types:
  - ChooseAttr
  split: validation
  refined_dataset: datasets/by_attribute_category/ChooseAttr_shape.csv
  image_folder: datasets/images
feature_identification:
  discrimination_threshold: 2.0
  min_activation: 0.0005
  min_diff: 0.0002
  top_k: 200
  aggregation: mean
  selection_method: abs_diff
  discrimination_method: abs_diff
  score_key: diff
  candidate_pool_k: 200
  position_type: attribute
  correctness_metric: option_logprob
  logprob_normalize: true
  batch_size: 256
  fallback:
    discrimination_threshold: 1.1
    min_activation: 0.00025
    min_diff: 0.0001
ablation:
  n_random_features: 200
  n_random_sets: 15
  random_sampling: matched
  position_type: attribute
  mode: replace
  delta_scale: 1.0
  operation: zero
  operation_scale: 1.0
random_control:
  n_random_sets: 15
  sampling: matched
  seed: 42
  matched_metric: correct_mean
evaluation:
  significance_level: 0.05
  primary_metric: forced_choice_margin
  logprob_normalize: true
