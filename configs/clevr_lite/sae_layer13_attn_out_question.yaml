model:
  name: "liuhaotian/llava-v1.5-7b"
  target_layer: 13
  d_model: 4096
  conv_mode: "vicuna_v1"
  model_base: null
  activation_site: "attn_out"

sae:
  n_features: 32768
  l1_coeff: 0.0005

training:
  batch_size: 256
  learning_rate: 0.0002
  epochs: 10
  seed: 42
  dtype: "float32"
  position_type: "question"

reproducibility:
  seed: 42
  deterministic: true
  benchmark: false

experiment:
  output_base: "output/sae_experiments"
  output_dir: null
  name: "sae_clevr_lite_layer13_attn_out_question"
  use_timestamp: false

dataset:
  format: "clevr_lite"
  data_dir: "datasets/clevr_lite"
  split: "train"
  task_types: ["CLEVRLite"]

feature_identification:
  discrimination_threshold: 2.0
  min_activation: 0.0
  min_diff: 0.0
  top_k: 200
  aggregation: "mean"
  selection_method: "ratio"
  score_key: "ratio"
  candidate_pool_k: 200
  position_type: "question"
  correctness_metric: "option_logprob"
  logprob_normalize: true
  batch_size: 256
  fallback:
    discrimination_threshold: 1.1
    min_activation: 0.0
    min_diff: 0.0

ablation:
  n_random_features: 200
  n_random_sets: 15
  random_sampling: "matched"
  position_type: "question"
  mode: "replace"
  delta_scale: 1.0
  operation: "zero"
  operation_scale: 1.0

random_control:
  n_random_sets: 15
  sampling: "matched"
  seed: 42
  matched_metric: "correct_mean"

evaluation:
  significance_level: 0.05
  primary_metric: "forced_choice_margin"
  logprob_normalize: true
