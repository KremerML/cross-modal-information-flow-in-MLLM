model:
  name: "liuhaotian/llava-v1.5-7b"
  target_layer: 0
  d_model: 4096
  conv_mode: "vicuna_v1"
  model_base: null
  activation_site: "attn_out"

sae:
  n_features: 4096       # reduced from 32768 (proportionate to available training vectors)
  l1_coeff: 0.0005       # reduced from 0.001 (less aggressive, targets <10% dead features)

training:
  batch_size: 256        # increased from 32
  learning_rate: 0.0002  # slightly higher initial LR (cosine annealing will decay it)
  epochs: 20             # increased from 10
  seed: 42
  dtype: "float32"
  position_type: "all"   # collect ALL token positions (image + question); ~30-50x more vectors than "attribute"

reproducibility:
  seed: 42
  deterministic: true
  benchmark: false

experiment:
  output_dir: "output/sae_experiments/sae_v2_layer0_attn_out"
  output_base: "output/sae_experiments"
  name: "sae_v2_layer0_attn_out"
  use_timestamp: false

dataset:
  task_types: ["ChooseAttr"]
  split: "validation"
  refined_dataset: "datasets/GQA_val_correct_question_with_choose_ChooseAttr.csv"
  image_folder: "datasets/images"

feature_identification:
  discrimination_threshold: 2.0
  min_activation: 0.0
  min_diff: 0.0
  top_k: 200
  aggregation: "mean"
  selection_method: "ratio"
  score_key: "ratio"
  candidate_pool_k: 200
  position_type: "image"   # identify features at image token positions (the visual source)
  correctness_metric: "option_logprob"
  logprob_normalize: true
  batch_size: 256
  fallback:
    discrimination_threshold: 1.1
    min_activation: 0.0
    min_diff: 0.0

ablation:
  n_random_features: 200
  n_random_sets: 15
  random_sampling: "matched"
  position_type: "image"   # ablate at image token positions (the visual source)
  mode: "replace"
  delta_scale: 1.0
  operation: "zero"
  operation_scale: 1.0

random_control:
  n_random_sets: 15
  sampling: "matched"
  seed: 42
  matched_metric: "correct_mean"

evaluation:
  significance_level: 0.05
  primary_metric: "forced_choice_margin"
  logprob_normalize: true
