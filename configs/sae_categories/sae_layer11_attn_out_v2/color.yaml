model:
  name: "liuhaotian/llava-v1.5-7b"
  target_layer: 11
  d_model: 4096
  conv_mode: "vicuna_v1"
  model_base: null
  activation_site: "attn_out"

sae:
  n_features: 4096
  l1_coeff: 0.0005

training:
  batch_size: 256
  learning_rate: 0.0002
  epochs: 20
  seed: 42
  dtype: "float32"
  position_type: "all"

reproducibility:
  seed: 42
  deterministic: true
  benchmark: false

experiment:
  output_dir: "output/sae_experiments/sae_v2_layer11_attn_out_color"
  output_base: "output/sae_experiments"
  name: "sae_v2_layer11_attn_out_color"
  use_timestamp: false

dataset:
  task_types: ["ChooseAttr"]
  split: "validation"
  refined_dataset: "datasets/by_attribute_category/ChooseAttr_color.csv"
  image_folder: "datasets/images"

feature_identification:
  discrimination_threshold: 2.0
  min_activation: 0.0
  min_diff: 0.0
  top_k: 200
  aggregation: "mean"
  selection_method: "ratio"
  score_key: "ratio"
  candidate_pool_k: 200
  position_type: "image"
  correctness_metric: "option_logprob"
  logprob_normalize: true
  batch_size: 256
  fallback:
    discrimination_threshold: 1.1
    min_activation: 0.0
    min_diff: 0.0

ablation:
  n_random_features: 200
  n_random_sets: 15
  random_sampling: "matched"
  position_type: "image"
  mode: "replace"
  delta_scale: 1.0
  operation: "zero"
  operation_scale: 1.0

random_control:
  n_random_sets: 15
  sampling: "matched"
  seed: 42
  matched_metric: "correct_mean"

evaluation:
  significance_level: 0.05
  primary_metric: "forced_choice_margin"
  logprob_normalize: true
