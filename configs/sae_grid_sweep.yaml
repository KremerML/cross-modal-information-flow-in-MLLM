sweep:
  name: "sae_grid_v1"
  base_config: "configs/sae_config_llava15_7b.yaml"
  output_base: "output/sae_experiments/sweeps"
  layers: [0, 11]
  train_position_types: ["attribute"]
  feature_position_types: ["attribute"]
  grid:
    top_k: [50, 200, 500]
    min_activation: [0.0]
    mode: ["residual", "replace"]
    delta_scale: [2.0]
  steps:
    train: true
    identify: true
    ablate: true
  reuse_checkpoints: true
  identify_max_samples: null
  ablation_max_samples: null
  dry_run: false
