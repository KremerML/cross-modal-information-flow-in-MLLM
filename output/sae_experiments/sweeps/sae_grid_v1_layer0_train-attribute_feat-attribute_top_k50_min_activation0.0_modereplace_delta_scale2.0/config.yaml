model:
  name: liuhaotian/llava-v1.5-7b
  target_layer: 0
  d_model: 4096
  conv_mode: vicuna_v1
  model_base: null
sae:
  n_features: 32768
  l1_coeff: 0.001
training:
  batch_size: 32
  learning_rate: 0.0001
  epochs: 10
  seed: 42
  dtype: float32
experiment:
  output_dir: output/sae_experiments/sweeps/sae_grid_v1_layer0_train-attribute_feat-attribute_top_k50_min_activation0.0_modereplace_delta_scale2.0
  output_base: output/sae_experiments
  name: sae_grid_v1_layer0_train-attribute_feat-attribute_top_k50_min_activation0.0_modereplace_delta_scale2.0
  use_timestamp: false
dataset:
  task_types:
  - ChooseAttr
  split: validation
  refined_dataset: datasets/GQA_val_correct_question_with_choose_ChooseAttr.csv
  image_folder: datasets/images
feature_identification:
  discrimination_threshold: 2.0
  min_activation: 0.0
  top_k: 50
  min_diff: 0.0
  position_type: attribute
  correctness_metric: option_logprob
  logprob_normalize: true
  batch_size: 256
  fallback:
    discrimination_threshold: 1.1
    min_activation: 0.0
    min_diff: 0.0
ablation:
  n_random_features: 50
  n_bootstrap: 1000
  position_type: attribute
  mode: replace
  delta_scale: 2.0
evaluation:
  significance_level: 0.05
  primary_metric: pred_token_prob
  logprob_normalize: true
sae_reuse:
  recon_threshold: 0.1
  kl_threshold: 0.5
  allow_missing_stats: true
  sample_size: 256
  search_paths:
  - output/sae_experiments
knockout:
  flows:
  - Image->Question
  - Image->Last
  window: 1
  filter_correct: true
  normalize_logprob: true
  max_samples: null
  top_k_layers: 5
  batch_size: 1
  num_workers: 2
  output_subdir: knockout
paths:
  output_dir: output/sae_experiments
  sae_checkpoint: output/sae_experiments/sae_checkpoint.pt
  feature_catalog: output/sae_experiments/feature_catalog.json
  results_dir: output/sae_experiments/results
